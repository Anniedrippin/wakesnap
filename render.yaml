# render.yaml — place this in the ROOT of your repo.
# Render reads it and provisions all services automatically (Blueprint deploy).

services:
  # ── Backend: FastAPI + Django ORM ────────────────────────────────────────────
  - type: web
    name: wakesnap-api
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn fastapi_app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wakesnap-db
          property: connectionString
      - key: GOOGLE_VISION_API_KEY
        sync: false # ← paste this manually in Render dashboard

  # ── Frontend: Static Site ─────────────────────────────────────────────────────
  - type: web
    name: wakesnap-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    buildCommand: "" # no build step needed — pure HTML
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ────────────────────────────────────────────────────────
databases:
  - name: wakesnap-db
    plan: free
    databaseName: wakesnap
    user: wakesnap
